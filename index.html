<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hang Streak</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--line:#232a37;--tx:#eef1f6;--mut:#8b94a7;--ac:#ff7a1a;--ok:#34d399;--bad:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
body{background:var(--bg);padding-bottom:90px}
main{max-width:520px;margin:0 auto;padding:20px 16px}
.view{display:none}.view.on{display:block}
h1{font-size:1.2rem;margin:0 0 4px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.big{text-align:center;padding:28px 18px}
.num{font-size:5.5rem;font-weight:800;line-height:1;color:var(--ac)}
.lbl{color:var(--mut);margin-top:6px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#1a0d00;font-weight:700;cursor:pointer}
button.sec{background:#222a38;color:var(--tx)}
button:disabled{opacity:.45}
input,select{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0f131a;color:var(--tx)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{flex:1}.row small{color:var(--mut);display:block}
.dot{width:12px;height:12px;border-radius:50%;background:#333b4a}.dot.ok{background:var(--ok)}
.flex{display:flex;gap:8px}
.week{display:flex;gap:6px;justify-content:center;margin-top:14px}
.week div{width:34px;height:34px;border-radius:10px;background:#1d2330;display:grid;place-items:center;font-size:.75rem;color:var(--mut)}
.week .ok{background:var(--ok);color:#04251a}
.timer{font-size:5rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.phase{text-align:center;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.ring{height:8px;background:#1d2330;border-radius:9px;overflow:hidden;margin:16px 0}
.ring i{display:block;height:100%;width:0;background:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;background:#0f131aee;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;color:var(--mut);flex:1;font-size:.8rem;padding:8px}
nav button.on{color:var(--ac)}
nav button b{display:block;font-size:1.4rem}
nav button.mid b{font-size:1.7rem}
.msg{color:var(--mut);text-align:center;padding:30px 0}
.code{font-size:1.6rem;letter-spacing:.2em;font-weight:800;color:var(--ac)}
label{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
</style>
</head>
<body>
<main>
<section id="v-timer" class="view">
  <h1>Timer</h1>
  <div class="card">
    <div class="phase" id="phase">Bereit</div>
    <div class="timer" id="tt">1:10</div>
    <div class="ring"><i id="bar"></i></div>
    <div class="flex"><button id="go" style="flex:1">Start</button><button id="rs" class="sec">Reset</button></div>
    <p class="lbl" id="thint" style="text-align:center">10 Sek. Vorbereitung + 60 Sek. Hängen. Danach wird dein Streak automatisch eingetragen.</p>
  </div>
</section>

<section id="v-streak" class="view on">
  <h1 id="gname">Streak</h1>
  <div id="streakBody"><div class="msg">Lade …</div></div>
</section>

<section id="v-acc" class="view">
  <h1>Account</h1>
  <div class="card"><div id="me">…</div></div>
  <div class="card">
    <b>Gruppe erstellen</b>
    <div class="flex" style="margin-top:10px"><input id="newName" placeholder="Gruppenname"><button id="mk">Erstellen</button></div>
  </div>
  <div class="card">
    <b>Gruppe beitreten</b>
    <div class="flex" style="margin-top:10px"><input id="joinCode" placeholder="Code, z. B. K7M2QX" maxlength="6" style="text-transform:uppercase"><button id="jn">Beitreten</button></div>
  </div>
  <div class="card" id="groupsCard"></div>
  <div class="card">
    <b>Einstellungen</b>
    <label>Ton am Ende <input type="checkbox" id="sSound" style="width:auto"></label>
    <label>Vibration <input type="checkbox" id="sVib" style="width:auto"></label>
    <label>Vorbereitung (Sek.) <input type="number" id="sPrep" min="0" max="30" style="width:80px"></label>
  </div>
  <p class="lbl" id="err" style="color:var(--bad)"></p>
</section>
</main>

<nav>
  <button data-v="timer"><b>⏱</b>Timer</button>
  <button data-v="streak" class="mid on"><b>🔥</b>Streak</button>
  <button data-v="acc"><b>👤</b>Account</button>
</nav>

<script>
const $=s=>document.querySelector(s);
let db=null,user=null,uid=null,myName='Ich';
let prof={groups:[],active:null,sound:true,vib:true,prep:10};
let members=[],unsub=null,names={};
const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return dk(d)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Navigation
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
});

// Streak math
function streakOf(set){let n=0,i=set.has(ago(0))?0:1;while(set.has(ago(i))){n++;i++}return n}
function groupStreak(){
  if(!members.length)return 0;
  const sets=members.map(m=>new Set(m.days||[]));
  const all=d=>sets.every(s=>s.has(d));
  let n=0,i=all(ago(0))?0:1;while(all(ago(i))){n++;i++}return n;
}

// Init
async function init(){
  try{
    const c=window.claude; if(!c)throw 0;
    [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    if(!db||!user)throw 0;
    uid=await user.id(); const me=await user.me(); myName=me.name||'Ich';
    if(!uid)throw 0;
  }catch(e){
    $('#streakBody').innerHTML='<div class="card msg">Bitte öffne die Seite eingeloggt mit deinem Claude-Account, damit die Synchronisierung funktioniert.</div>';
    return;
  }
  $('#me').innerHTML='Angemeldet als <b>'+esc(myName)+'</b><br><small class="lbl">Dein Fortschritt ist auf allen Geräten gleich.</small>';
  db.doc('data/users/'+uid+'/prof').onSnapshot(s=>{
    if(s.exists)Object.assign(prof,s.data());
    $('#sSound').checked=prof.sound;$('#sVib').checked=prof.vib;$('#sPrep').value=prof.prep;
    if(!prof.active||!prof.groups.includes(prof.active))prof.active=prof.groups[0]||null;
    renderGroups();watchGroup();
  },e=>$('#err').textContent='Fehler: '+(e.message||e.code));
}
const saveProf=()=>db.doc('data/users/'+uid+'/prof').set(prof).catch(e=>$('#err').textContent=e.message);

// Group watching
let curGid=null,gdoc=null,unsubG=null;
function watchGroup(){
  if(curGid===prof.active&&unsub)return;
  curGid=prof.active;unsub&&unsub();unsubG&&unsubG();unsub=unsubG=null;members=[];gdoc=null;
  if(!curGid){render();return}
  unsubG=db.doc('groups/'+curGid).onSnapshot(s=>{gdoc=s.exists?s.data():null;render()});
  unsub=db.collection('checkins').where('gid','==',curGid).onSnapshot(async q=>{
    members=q.docs.map(d=>d.data());
    const ids=members.map(m=>m.uid).filter(i=>!names[i]);
    if(ids.length){try{const p=await user.profiles(ids);for(const i in p)names[i]=p[i].isMe?'Du':(p[i].name||'Jemand')}catch(e){}}
    render();
  });
}

function render(){
  const body=$('#streakBody');
  if(!curGid){body.innerHTML='<div class="card msg">Noch keine Gruppe.<br>Erstelle oder tritt unter <b>Account</b> einer bei.</div>';$('#gname').textContent='Streak';return}
  $('#gname').textContent=gdoc?gdoc.name:'Streak';
  const today=ago(0),mine=members.find(m=>m.uid===uid),done=mine&&(mine.days||[]).includes(today);
  const gs=groupStreak();
  const days=[...Array(7)].map((_,i)=>{const d=ago(6-i);const ok=members.length&&members.every(m=>(m.days||[]).includes(d));const dt=new Date(d+'T12:00');return '<div class="'+(ok?'ok':'')+'">'+['So','Mo','Di','Mi','Do','Fr','Sa'][dt.getDay()]+'</div>'}).join('');
  body.innerHTML=
   '<div class="card big"><div class="num">'+gs+'</div><div class="lbl">Tage Gruppen-Streak 🔥</div><div class="week">'+days+'</div></div>'+
   '<button id="ci" style="width:100%;margin-bottom:14px" '+(done?'disabled':'')+'>'+(done?'✓ Heute erledigt':'Heute erledigt eintragen')+'</button>'+
   '<div class="card"><b>Mitglieder</b>'+members.map(m=>{const s=new Set(m.days||[]);const ok=s.has(today);return '<div class="row"><span class="dot '+(ok?'ok':'')+'"></span><div class="n">'+esc(names[m.uid]||m.name||'…')+'<small>'+(ok?'Heute geschafft':'Noch offen')+'</small></div><b>'+streakOf(s)+' 🔥</b></div>'}).join('')+'</div>';
  const b=$('#ci');b&&(b.onclick=checkin);
}

async function checkin(){
  if(!curGid)return;
  const id=curGid+'_'+uid,ref=db.doc('checkins/'+id);
  try{
    const s=await ref.get();const days=s.exists?(s.data().days||[]):[];
    const t=dk();if(!days.includes(t))days.push(t);
    await ref.set({gid:curGid,uid,name:myName,days:days.slice(-400)});
  }catch(e){$('#err').textContent='Eintragen fehlgeschlagen: '+(e.message||e.code)}
}

// Groups
function renderGroups(){
  const c=$('#groupsCard');
  if(!prof.groups.length){c.innerHTML='<span class="lbl">Keine Gruppen.</span>';return}
  c.innerHTML='<b>Meine Gruppen</b><select id="gsel" style="margin:10px 0">'+prof.groups.map(g=>'<option value="'+g+'"'+(g===prof.active?' selected':'')+'>'+g+(names['g'+g]?' – '+esc(names['g'+g]):'')+'</option>').join('')+'</select><div class="lbl">Einladungscode: <span class="code">'+esc(prof.active||'')+'</span></div><button class="sec" id="lv" style="margin-top:10px">Gruppe verlassen</button>';
  $('#gsel').onchange=e=>{prof.active=e.target.value;saveProf()};
  $('#lv').onclick=async()=>{if(!confirm('Gruppe verlassen?'))return;const g=prof.active;prof.groups=prof.groups.filter(x=>x!==g);prof.active=prof.groups[0]||null;try{await db.doc('checkins/'+g+'_'+uid).delete()}catch(e){}saveProf()};
}
const rndCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return[...Array(6)].map(()=>a[Math.floor(Math.random()*a.length)]).join('')};
$('#mk').onclick=async()=>{
  const n=$('#newName').value.trim();if(!n||!db)return;
  try{
    const code=rndCode();await db.doc('groups/'+code).set({name:n,owner:uid});
    prof.groups.push(code);prof.active=code;await saveProf();await checkinInit(code);$('#newName').value='';
  }catch(e){$('#err').textContent=e.message||e.code}
};
$('#jn').onclick=async()=>{
  const code=$('#joinCode').value.trim().toUpperCase();if(!code||!db)return;
  try{
    const s=await db.doc('groups/'+code).get();
    if(!s.exists){$('#err').textContent='Gruppe nicht gefunden.';return}
    $('#err').textContent='';
    if(!prof.groups.includes(code))prof.groups.push(code);
    prof.active=code;await saveProf();await checkinInit(code);$('#joinCode').value='';
  }catch(e){$('#err').textContent=e.message||e.code}
};
async function checkinInit(code){
  const ref=db.doc('checkins/'+code+'_'+uid);const s=await ref.get();
  if(!s.exists)await ref.set({gid:code,uid,name:myName,days:[]});
}

// Settings
$('#sSound').onchange=e=>{prof.sound=e.target.checked;saveProf()};
$('#sVib').onchange=e=>{prof.vib=e.target.checked;saveProf()};
$('#sPrep').onchange=e=>{prof.prep=Math.max(0,Math.min(30,+e.target.value||0));saveProf()};

// Timer (Vorbereitung + 60 Sek. Hängen)
let tEnd=0,tInt=null,tTotal=0,tPrep=0;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function beep(n){try{const a=new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start(a.currentTime+i*.3);o.stop(a.currentTime+i*.3+.18)}}catch(e){}}
function tick(){
  const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  $('#tt').textContent=fmt(left);
  $('#bar').style.width=(100*(1-left/tTotal))+'%';
  const hang=left<=60;
  $('#phase').textContent=hang?'Hängen!':'Mach dich bereit';
  $('#phase').style.color=hang?'var(--ok)':'var(--ac)';
  if(left===60&&tPrep>0&&!tick.f){tick.f=1;if(prof.sound)beep(2);if(prof.vib&&navigator.vibrate)navigator.vibrate(200)}
  if(left<=0){clearInterval(tInt);tInt=null;$('#phase').textContent='Geschafft! ✓';$('#go').textContent='Start';
    if(prof.sound)beep(3);if(prof.vib&&navigator.vibrate)navigator.vibrate([300,100,300]);
    checkin();$('#thint').textContent=curGid?'Streak wurde eingetragen. 🔥':'Tritt einer Gruppe bei, damit dein Streak gezählt wird.'}
}
$('#go').onclick=()=>{
  if(tInt){clearInterval(tInt);tInt=null;$('#go').textContent='Start';$('#phase').textContent='Abgebrochen';return}
  tPrep=prof.prep;tTotal=60+tPrep;tEnd=Date.now()+tTotal*1000;tick.f=0;
  $('#go').textContent='Stopp';tick();tInt=setInterval(tick,200);
};
$('#rs').onclick=()=>{clearInterval(tInt);tInt=null;$('#tt').textContent=fmt(60+prof.prep);$('#bar').style.width='0';$('#phase').textContent='Bereit';$('#phase').style.color='';$('#go').textContent='Start'};

init();
</script>
</body>
</html>
